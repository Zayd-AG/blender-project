name: Validate addon

on:
  push:
  pull_request:

env:
  BLENDER_VERSION: "5.2.0"
  MIN_GEOMETRY_PRECISION: "0.95"
  MIN_GEOMETRY_RECALL: "0.95"
  MIN_AGENT_F1: "1.00"

jobs:
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender headlessly
        run: |
          curl --fail --location --output blender.tar.xz "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar --extract --file blender.tar.xz
          echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Run deterministic Blender benchmarks
        working-directory: blender_addon
        run: blender --background --python run_benchmark.py
      - name: Lint Blender source
        run: |
          python -m pip install ruff
          ruff check blender_addon
      - name: Enforce benchmark thresholds
        working-directory: blender_addon
        run: python check_benchmark_thresholds.py
      - name: Package addon
        run: python blender_addon/package_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: asset-validator-addon
          path: dist/asset_validator.zip
  roblox-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Roblox toolchain
        run: |
          cargo install rokit --locked
          cd roblox_plugin
          rokit install --no-trust-check
      - name: Lint Luau plugin source
        working-directory: roblox_plugin
        run: selene src
      - name: Install TestEZ
        working-directory: roblox_plugin
        run: wally install
      - name: Build plugin package
        working-directory: roblox_plugin
        run: |
          mkdir -p ../dist
          rojo build --output ../dist/ImportValidator.rbxmx default.project.json
      - uses: actions/upload-artifact@v4
        with:
          name: import-validator-plugin
          path: dist/ImportValidator.rbxmx
  roblox-studio-tests:
    # run-in-roblox drives an installed Studio instance. Enable this job only
    # on a dedicated Windows self-hosted runner labeled `roblox-studio`.
    if: vars.ENABLE_ROBLOX_STUDIO_TESTS == 'true'
    runs-on: [self-hosted, windows, roblox-studio]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Roblox toolchain
        run: |
          cargo install rokit --locked
          cd roblox_plugin
          rokit install --no-trust-check
      - name: Install TestEZ and build the test place
        working-directory: roblox_plugin
        run: |
          wally install
          rojo build --output ../dist/ImportValidator-tests.rbxlx test.project.json
      - name: Run TestEZ suite in Roblox Studio
        working-directory: roblox_plugin
        run: run-in-roblox --place ../dist/ImportValidator-tests.rbxlx --script tests/TestRunner.server.luau
