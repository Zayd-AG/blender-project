name: Validate addon

on:
  push:
  pull_request:

env:
  BLENDER_VERSION: "5.2.0"
  MIN_GEOMETRY_PRECISION: "0.95"
  MIN_GEOMETRY_RECALL: "0.95"
  MIN_AGENT_F1: "1.00"

jobs:
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender headlessly
        run: |
          curl --fail --location --output blender.tar.xz "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar --extract --file blender.tar.xz
          echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Run deterministic Blender benchmarks
        working-directory: blender_addon
        run: blender --background --python run_benchmark.py
      - name: Enforce benchmark thresholds
        working-directory: blender_addon
        run: python check_benchmark_thresholds.py
      - name: Package addon
        run: |
          mkdir -p dist
          cd blender_addon
          zip --recurse-paths ../dist/asset_validator.zip asset_validator -x '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: asset-validator-addon
          path: dist/asset_validator.zip
  roblox-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selene
        run: cargo install selene --locked
      - name: Lint Luau plugin and tests
        working-directory: roblox_plugin
        run: selene src tests
      - name: Install Rojo
        run: cargo install rojo --locked
      - name: Install Wally and run-in-roblox
        run: |
          cargo install wally-cli --locked
          cargo install run-in-roblox --version 0.3.0 --locked
      - name: Install TestEZ
        working-directory: roblox_plugin
        run: wally install
      - name: Build plugin package
        working-directory: roblox_plugin
        run: |
          mkdir -p ../dist
          rojo build --output ../dist/ImportValidator.rbxmx default.project.json
      - name: Run TestEZ suite headlessly
        working-directory: roblox_plugin
        run: run-in-roblox --place ../dist/ImportValidator.rbxmx --script tests/TestRunner.server.luau
      - uses: actions/upload-artifact@v4
        with:
          name: import-validator-plugin
          path: dist/ImportValidator.rbxmx
